name: Release

# Membangun installer Windows.
# - Push tag "vX.Y.Z"  -> build, lalu unggah installer + checksum ke GitHub Releases.
# - Run workflow manual -> build saja; hasilnya bisa diunduh dari tab Artifacts pada run tersebut.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # dibutuhkan untuk membuat GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pastikan tag sama dengan versi di package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF tidak sama dengan versi package.json ($v). Ubah versi lalu buat tag lagi."
            exit 1
          fi

      - name: Install dependensi
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      # --publish never: electron-builder tidak boleh mengunggah sendiri; pengunggahan dilakukan langkah Release di bawah
      - name: Build installer
        shell: bash
        run: |
          npx electron-vite build
          npx electron-builder --win nsis --x64 --publish never

      - name: Buat checksum SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter 'live-comment-overlay-setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -FilePath "$($_.FullName).sha256"
          }
          Get-ChildItem dist -Filter 'live-comment-overlay-setup-*'

      - name: Simpan hasil build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/live-comment-overlay-setup-*.exe
            dist/live-comment-overlay-setup-*.exe.sha256
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/live-comment-overlay-setup-*.exe
            dist/live-comment-overlay-setup-*.exe.sha256
          generate_release_notes: true
